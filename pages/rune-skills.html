<!-- ========================================== -->
<!-- TAB: RUNE SKILLS -->
<!-- ========================================== -->
<div id="tab-runeskills" class="tab-content">
    <h2>Công thức Rune Skills</h2>
    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Danh sách các kỹ năng được cường hóa
        bởi Hệ thống Runeword (Bảng Ngọc).</p>

    <!-- BỘ LỌC RUNE SKILLS -->
    <div class="filter-container">
        <div style="display: flex; align-items: center; gap: 10px;">
            <label class="filter-label">Loại Kỹ Năng:</label>
            <select id="filterSkillType" class="filter-select" onchange="applyRuneSkillFilter()">
                <option value="all">Tất cả (All)</option>
                <option value="active">Chủ động (Bản thân kích hoạt skills)</option>
                <option value="passive">Bị động (Có tỉ lệ skill tự kích hoạt)</option>
            </select>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <label class="filter-label">Hình Dạng Rune:</label>
            <select id="filterRuneShape" class="filter-select" onchange="applyRuneSkillFilter()">
                <option value="all">Tất cả (All)</option>
                <option value="Tear">Giọt nước (Tear)</option>
                <option value="Triangle">Tam giác (Triangle)</option>
                <option value="Square">Hình vuông (Square)</option>
                <option value="Pentagon">Ngũ giác (Pentagon)</option>
                <option value="Hexagon">Lục giác (Hexagon)</option>
                <option value="Diamond">Hình thoi (Diamond)</option>
            </select>
        </div>
    </div>

    <div class="sub-btn-group">
        <button class="sub-btn active" onclick="openRuneSkillSub(event, 'rs-legend')">Legend</button>
        <button class="sub-btn" onclick="openRuneSkillSub(event, 'rs-epic')">Epic</button>
        <button class="sub-btn" onclick="openRuneSkillSub(event, 'rs-rare')">Rare</button>
    </div>

    <!-- MỤC LEGEND -->
    <div id="rs-legend" class="runeskills-sub" style="display: block;">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="25%">Thông tin Runeword</th>
                        <th width="25%">Yêu cầu & Ngọc</th>
                        <th width="50%">Thông tin Kỹ năng Cường hóa</th>
                    </tr>
                </thead>
                <tbody id="rune-skills-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- EPIC -->
    <div id="rs-epic" class="runeskills-sub">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="25%">Thông tin Runeword</th>
                        <th width="25%">Yêu cầu & Ngọc</th>
                        <th width="50%">Hiệu ứng cường hóa</th>
                    </tr>
                </thead>
                <tbody id="rune-skills-epic-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- RARE -->
    <div id="rs-rare" class="runeskills-sub">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="25%">Thông tin Runeword</th>
                        <th width="25%">Yêu cầu & Ngọc</th>
                        <th width="50%">Hiệu ứng cường hóa</th>
                    </tr>
                </thead>
                <tbody id="rune-skills-rare-table-body"></tbody>
            </table>
        </div>
    </div>
</div>
