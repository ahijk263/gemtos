<!-- ========================================== -->
<!-- TAB: RUNES & COMBINER -->
<!-- ========================================== -->

<div id="tab-runes" class="tab-content">

    <div class="combiner-section">
        <h3 style="margin-top: 0; color: var(--accent-primary);">
            Bộ lọc & Tổ Hợp Ngọc (Rune Combiner)
        </h3>

        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">
            Nhấn vào các Rune bên dưới để thêm vào tổ hợp tìm kiếm (tối đa 4).
            Nhấn lại để bỏ chọn.
        </p>

        <div id="selected-runes-container" class="selected-runes-container"></div>

        <button class="ctrl-btn" id="clear-runes-btn" onclick="clearRunes()"
            style="display: none; margin-top: 15px; border-color: var(--danger); color: var(--danger);">
            Xóa tất cả
        </button>
    </div>


    <!-- ========================================== -->
    <!-- FILTER RESULT -->
    <!-- ========================================== -->

    <div id="filter-result-box">
        <h3 id="filter-title" style="margin-top: 0;">
            Kết quả:
        </h3>

        <div id="filter-content"></div>
    </div>


    <!-- ========================================== -->
    <!-- RUNE LIST -->
    <!-- ========================================== -->

    <h3 style="margin-top: 20px;">
        Danh sách Rune
    </h3>

    <div class="table-responsive" style="border: none;">
        <table style="border: none;">
            <tbody id="runes-table-body"></tbody>
        </table>
    </div>

</div>
